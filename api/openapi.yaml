openapi: 3.0.3
info:
  title: Notification Service
  version: 1.0.0
  description: |
    Accepts SMS, email and push notifications, stores them, and delivers them asynchronously
    through an external provider with priorities, a rate limit of 100 messages per second per
    channel, retries with backoff, a circuit breaker, idempotency, cancellation, templates and
    live status updates.

    Delivery is **at-least-once**: every provider request carries `X-Idempotency-Key` (the
    notification ID) so a provider can drop the rare duplicate. `sent` means the provider
    accepted the message, not that the user received it.

    See `docs/DESIGN.md` for how and why it works.
servers:
  - url: http://localhost:8080
tags:
  - name: Notifications
  - name: Batches
  - name: Templates
  - name: Live updates
  - name: Operations

paths:
  /api/v1/notifications:
    post:
      tags: [Notifications]
      summary: Create a notification
      description: |
        Send either `content`, or `templateId` with `variables`. The notification is stored as
        `pending` and delivered asynchronously.

        With an `Idempotency-Key`, repeating the identical request returns the original
        notification (`200`) instead of creating another; the same key with a different request
        is rejected (`422`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNotification' }
            examples:
              content:
                summary: With content
                value: { recipient: "+905551234567", channel: sms, content: "Your code is 4821", priority: high }
              template:
                summary: From a template
                value: { recipient: "+905551234567", channel: sms, templateId: "01a2156f-5ea8-7d0e-9e79-6e5f855e53b5", variables: { name: "Ayşe", order: "A1" } }
              scheduled:
                summary: Scheduled
                value: { recipient: "user@example.com", channel: email, content: "Flash sale starts now", scheduledAt: "2026-12-01T09:00:00Z" }
      responses:
        '202':
          description: Accepted and queued.
          headers:
            Location: { schema: { type: string }, description: URL of the notification. }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '200':
          description: Idempotent replay; the original notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/Invalid' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422':
          description: The idempotency key was already used with a different request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Notifications]
      summary: List notifications
      description: Newest first, with keyset pagination. Pass `nextCursor` back as `cursor` for the next page.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - { name: batchId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: Created at or after (RFC 3339)., schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Created before (RFC 3339)., schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: Opaque cursor from a previous page., schema: { type: string } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  nextCursor: { type: string, description: Absent on the last page. }
        '400': { $ref: '#/components/responses/Invalid' }

  /api/v1/notifications/batch:
    post:
      tags: [Batches]
      summary: Create up to 1000 notifications
      description: |
        Partial acceptance: valid items are stored, invalid ones are reported with their reasons.
        Each item may carry its own `idempotencyKey`, so the whole batch can be resent after
        fixing the rejected items: unchanged items come back as `duplicate`.
        If no item is accepted, nothing is stored and the answer is `400`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    allOf:
                      - $ref: '#/components/schemas/CreateNotification'
                      - type: object
                        properties:
                          idempotencyKey: { type: string, maxLength: 255 }
      responses:
        '202':
          description: At least one item was accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResult' }
        '400':
          description: The batch is malformed, or no item was accepted (see each item's error).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchResult'
                  - $ref: '#/components/schemas/Error'
        '413': { $ref: '#/components/responses/TooLarge' }

  /api/v1/notifications/{id}:
    get:
      tags: [Notifications]
      summary: Get a notification
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/notifications/{id}/cancel:
    post:
      tags: [Notifications]
      summary: Cancel a pending notification
      description: Only `pending` notifications can be cancelled. Once a worker has claimed one, it is in flight.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No longer pending; `error.current` shows its status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/batches/{id}:
    get:
      tags: [Batches]
      summary: Get a batch with counts per status
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/templates:
    post:
      tags: [Templates]
      summary: Create a template
      description: The body may contain `{{name}}` placeholders (letters, digits and `_`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, channel, body]
              properties:
                name: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,99}$', example: order_shipped }
                channel: { $ref: '#/components/schemas/Channel' }
                body: { type: string, example: "Merhaba {{name}}, {{order}} kargoda." }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/Invalid' }
        '409':
          description: A template with this name exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Templates]
      summary: List templates
      responses:
        '200':
          description: All templates, by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Template' } }

  /api/v1/templates/{id}:
    get:
      tags: [Templates]
      summary: Get a template
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Templates]
      summary: Replace a template's body
      description: Notifications already created from the template keep the text they were rendered with.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/ws:
    get:
      tags: [Live updates]
      summary: Stream status changes over WebSocket
      description: |
        Upgrade to a WebSocket. The first messages are snapshots of the current state, one per
        notification and batch requested; then every status change follows as it happens:

        ```
        {"type":"snapshot","notification":{...}}
        {"type":"snapshot","batch":{...}}
        {"type":"status","change":{"id":"…","batchId":"…","channel":"sms","status":"sent","attempts":1,"at":"…"}}
        ```

        A client that reads too slowly is disconnected (close code 1008) and should reconnect.
        Browser origins are limited by `WS_ALLOWED_ORIGINS`.
      parameters:
        - { name: notificationId, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: batchId, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
      responses:
        '101': { description: Switching to the WebSocket protocol. }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { description: Browser origin not allowed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/stats:
    get:
      tags: [Operations]
      summary: Delivery snapshot for people
      description: Queue depth and backlog now; sent, failed, success rate and latency over the window.
      parameters:
        - { name: window, in: query, schema: { type: string, default: 5m, example: 15m }, description: Go duration up to 24h. }
      responses:
        '200':
          description: Per channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '400': { $ref: '#/components/responses/Invalid' }

  /healthz:
    get:
      tags: [Operations]
      summary: Liveness
      description: 200 while the process runs. Never checks dependencies.
      responses:
        '200': { description: Alive. }
  /readyz:
    get:
      tags: [Operations]
      summary: Readiness
      description: Pings PostgreSQL and Redis.
      responses:
        '200': { description: Ready. }
        '503': { description: A dependency is down; the body names it. }
  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics
      responses:
        '200': { description: Prometheus text format. }
  /openapi.yaml:
    get:
      tags: [Operations]
      summary: This document
      responses:
        '200': { description: OpenAPI 3 YAML. }
  /docs:
    get:
      tags: [Operations]
      summary: Swagger UI for this document
      responses:
        '200': { description: HTML. }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 255 }
      description: Makes retries safe. The same key with the same request returns the original.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
      description: Your ID for this request; it is stored and logged. Without it, the trace ID is used.
  headers:
    CorrelationId:
      schema: { type: string }
      description: The request's correlation ID.
  responses:
    Invalid:
      description: Invalid request; `error.fields` lists every problem.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_failed
              message: request is invalid
              fields:
                - { field: recipient, message: "must be an E.164 phone number, for example +905551234567" }
                - { field: content, message: "is 95 characters; SMS allows 70 because it contains characters outside GSM-7 (such as ş, ğ, ı, İ or emoji)" }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: Body too large (1 MiB per notification, 32 MiB per batch).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
    Priority:
      type: string
      enum: [high, normal, low]
      default: normal
    Status:
      type: string
      enum: [pending, processing, sent, failed, cancelled]
      description: "`sent` means accepted by the provider."
    CreateNotification:
      type: object
      required: [recipient, channel]
      properties:
        recipient:
          type: string
          description: "SMS: E.164 phone. Email: address. Push: device token."
        channel: { $ref: '#/components/schemas/Channel' }
        content:
          type: string
          description: |
            Required unless `templateId` is given. SMS: one segment, 160 GSM-7 characters, or 70 if
            any character is outside GSM-7 (for Turkish: ş ğ ı İ Ş Ğ). Email: 100 KB. Push: 4 KB.
        priority: { $ref: '#/components/schemas/Priority' }
        scheduledAt: { type: string, format: date-time, description: Deliver no earlier than this. }
        templateId: { type: string, format: uuid }
        variables:
          type: object
          additionalProperties: { type: string }
    Notification:
      type: object
      required: [id, recipient, channel, content, priority, status, attempts, maxAttempts, correlationId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        recipient: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        content: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/Status' }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        scheduledAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time, description: Present while pending. }
        providerMessageId: { type: string }
        lastError: { type: string }
        correlationId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
    BatchResult:
      type: object
      required: [total, accepted, rejected, items]
      properties:
        batchId: { type: string, format: uuid, description: Absent when nothing was accepted. }
        total: { type: integer }
        accepted: { type: integer }
        rejected: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [index]
            properties:
              index: { type: integer }
              id: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/Status' }
              duplicate: { type: boolean, description: Replay of an earlier request with the same key. }
              error: { $ref: '#/components/schemas/ErrorDetail' }
    BatchSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        total: { type: integer }
        accepted: { type: integer }
        rejected: { type: integer }
        statusCounts:
          type: object
          properties:
            pending: { type: integer }
            processing: { type: integer }
            sent: { type: integer }
            failed: { type: integer }
            cancelled: { type: integer }
        createdAt: { type: string, format: date-time }
    Template:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        body: { type: string }
        variables: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Stats:
      type: object
      properties:
        window: { type: string, example: 5m0s }
        channels:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ChannelStats' }
    ChannelStats:
      type: object
      properties:
        queueDepth:
          type: object
          description: IDs waiting in Redis, per priority.
          additionalProperties: { type: integer }
        pending: { type: integer, description: "Waiting overall, including backlog in PostgreSQL." }
        notYetDue: { type: integer, description: "Part of pending that may not be sent yet: scheduled for later, or backing off before a retry." }
        processing: { type: integer }
        sent: { type: integer }
        failed: { type: integer }
        attempts: { type: integer, description: Provider calls in the window. }
        successRate: { type: number, nullable: true, description: Share of provider calls that succeeded; null without calls. }
        providerLatencyMs: { $ref: '#/components/schemas/Latency' }
        endToEndLatencyMs: { $ref: '#/components/schemas/Latency' }
    Latency:
      type: object
      properties:
        p50: { type: integer }
        p95: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: validation_failed
          description: validation_failed, invalid_request, not_found, not_cancellable, idempotency_key_reused, name_taken, body_too_large, internal
        message: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        current:
          allOf: [{ $ref: '#/components/schemas/Notification' }]
          description: On a 409, the notification as it is now.
